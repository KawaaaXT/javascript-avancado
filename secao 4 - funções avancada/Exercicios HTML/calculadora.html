<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">

        <div class="visor">
            <p id="resultado">0</p>
        </div>

        <div class="botoes">

            <button class="btn-clean">AC</button>
            <button class="btn-sinal">+/-</button>
            <button class="btn-porcentagem">%</button>
            <button class="operador btn-divisao">÷</button>

            <button class="btn-num">7</button>
            <button class="btn-num">8</button>
            <button class="btn-num">9</button>
            <button class="operador btn-multiplicacao">×</button>

            <button class="btn-num">4</button>
            <button class="btn-num">5</button>
            <button class="btn-num">6</button>
            <button class="operador btn-subtracao">−</button>

            <button class="btn-num">1</button>
            <button class="btn-num">2</button>
            <button class="btn-num">3</button>
            <button class="operador btn-somar">+</button>

            <button class="btn-num">0</button>
            <button class="btn-virgula">,</button>
            <button class="operador btn-igual">=</button>

        </div>

    </main>

    <script src="../J-S-Script/calScript.js"></script>
</body>
</html>

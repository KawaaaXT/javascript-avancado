


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    
</head>
<body>

    <main class="container">
        <h1>Gerador de Senhas</h1>

        <form id="formulario">

            <div class="resultado">
                <label for="senha">Senha gerada:</label>
                <input type="text" id="senha" readonly>
                <button type="button" id="copiar">Copiar</button>
            </div>

            <div class="comprimento">
                <label for="quantidade">Comprimento da senha:</label>
                <input type="number" id="quantidade" min="8" max="64" value="12">
            </div>

            <div class="opcoes">
                <h2>Tipos de caracteres</h2>

                <label>
                    <input type="checkbox" name="caracteres" value="letras" id="maiusculas">
                    Letras maiúsculas (A-Z)
                </label>

                <label>
                    <input type="checkbox" name="caracteres" value="letras" id="minusculas">
                    Letras minúsculas (a-z)
                </label>

                <label>
                    <input type="checkbox" name="caracteres" value="numeros" id="numeros">
                    Números (0-9)
                </label>

                <label>
                    <input type="checkbox" name="caracteres" value="simbolos" id="simbolos">
                    Símbolos (!@#$%)
                </label>
            </div>

            <button type="submit" id="gerar">
                Gerar senha
            </button>

        </form>

    </main>

    <script src="assets/js/bundle.js"></script>

</body>
</html>

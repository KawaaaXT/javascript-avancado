
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Gestão de Funcionários</h1>

        <section class="cadastro">
            <h2>Cadastrar Funcionário</h2>

            <form id="form-funcionario">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome" 
                        placeholder="Digite o nome"
                    >
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        placeholder="Digite a idade"
                    >
                </div>

                <div class="campo">
                    <label for="cargo">Cargo</label>
                    <input
                        type="text"
                        id="cargo"
                        placeholder="Ex: Programador"
                    >
                </div>

                <div class="campo">
                    <label for="salario">Salário</label>
                    <input
                        type="number"
                        id="salario"
                        placeholder="Ex: 1800"
                    >
                </div>

                <button type="submit" id="btn-cadastrar">
                    Cadastrar Funcionário
                </button>

            </form>
        </section>


        <section class="filtro">

            <h2>Pesquisar Funcionário</h2>

            <div class="area-filtro">

                <input
                    type="text"
                    id="pesquisa-cargo"
                    placeholder="Pesquisar por cargo..."
                >

                <button id="btn-filtrar">
                    Filtrar
                </button>

                <button id="btn-mostrar-todos">
                    Mostrar Todos
                </button>

            </div>

        </section>


        <section class="funcionarios">

            <h2>Funcionários Cadastrados</h2>

            <div id="lista-funcionarios">
                <ul id="list-official">

                </ul>

            </div>

        </section>


        <section class="resumo">

            <div class="resumo-card">
                <span>Total de Funcionários</span>
                <strong id="total-funcionarios">0</strong>
            </div>

            <div class="resumo-card">
                <span>Total de Salários</span>
                <strong id="total-salarios">0€</strong>
            </div>

            <div class="resumo-card">
                <span>Média Salarial</span>
                <strong id="media-salarial">0€</strong>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

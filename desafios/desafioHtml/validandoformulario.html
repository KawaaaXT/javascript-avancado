<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro • Dados pessoais</title>
  <link rel="stylesheet" href="../estyle/style2.css">
</head>
<body>
  <main class="page-shell">
    <section class="form-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <p class="eyebrow">SEUS DADOS, COM SEGURANÇA</p>
      <h1 id="page-title">Vamos começar?</h1>
      <p class="intro">Preencha seus dados para criar seu cadastro.</p>

      <form action="#" method="post">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name"
                 placeholder="Ex.: Ana Souza">
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text" inputmode="numeric"
                 placeholder="000.000.000-00" aria-describedby="cpf-hint">
          <span class="field-hint" id="cpf-hint">
            Digite seu CPF, somente para identificação.
          </span>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="idade">Idade</label>
            <input id="idade" name="idade" type="number" min="0" max="120"
                   placeholder="Ex.: 25">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password"
                   autocomplete="new-password" placeholder="Crie uma senha">
          </div>
        </div>

        <button type="submit">Continuar <span aria-hidden="true">→</span></button>
      </form>

      <p class="privacy-note">
        <span aria-hidden="true">▣</span>
        Seus dados são tratados com cuidado e segurança.
      </p>
    </section>
    
    <script src="../javascript/validandoscript.js"></script>

    <footer>© 2025 • Cadastro simples e seguro</footer>
  </main>
</body>
</html>

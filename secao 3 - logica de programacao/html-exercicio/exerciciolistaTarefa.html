
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="../estyle/sstyle.css">
</head>
<body>

    <main class="container">

        <section class="todo">
            <h1>LISTA DE TAREFA</h1>

            <form id="formulario">
                <input
                    type="text"
                    id="tarefa"
                    placeholder="Digite uma tarefa..."
                    autocomplete="off"
                >

                <button type="submit" id="adicionar">
                    ADICIONAR
                </button>
            </form>

            <ul id="lista-tarefas">
                <!-- As tarefas serão adicionadas aqui pelo JavaScript -->
            </ul>

        </section>

    </main>

    <script src="../Js-Js/todoListScript.js"></script>

</body>
</html>

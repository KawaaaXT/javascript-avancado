<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estyle/style.css">
    <title>Sistema de carrinho</title>
</head>
<body>
    <header>
        <h1 class="header">
            Sistema de carrinho de Compras
        </h1>
    </header>
    <main>
        <section>
            <div id="lista">
                <ul>
                    <li>Teclado  R$ 120</li>
                    <li>Mouse R$ 70 </li>
                    <li>Telemovel R$ 500</li>
                    <li>Fone R$40 </li>
                </ul>

            </div>

            <div>
                <form id="formulario">
                    <p>
                        Qual produto deseja : <input type="text" name="tntproduto" id="produto" placeholder="Qual Sera O Produto?">
                    </p>

                    <p>
                        Preço : <input type="text" name="tntPreco" id="preco" placeholder="Preço">
                    </p>

                   <p>
                     Quantidades : <input type="text" name="tntquantidade" id="quantidade" placeholder="Quantidade Desejada?">
                   </p>
                    <p>
                       
                        <button id="btn" type="submit">Enviar</button>

                    </p>
                </form>
                <div id="resultado">

                </div>
            </div>
        </section> <!--Fim section detalhes-->

    </main>

    <script src="../Js-Js/sistemascript.js"></script>
    
</body>
</html>

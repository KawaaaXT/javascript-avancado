<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro Online </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="timer">
        <h1> TIMER </h1>

        <div id="contador" aria-label="Contador do timer">
            <p class="relogio">
                00:00:00
            </p>
        </div>

        <div id="botoes">
            <button id="button-iniciar" type="button">Iniciar</button>
            <button id="button-pausar" type="button"> Pausar</button>
            <button id="button-zerar" type="button"> Zerar</button>
        </div>
    </main>

    <script src="../Js-Js/timerScript.js"></script>
</body>
</html>
